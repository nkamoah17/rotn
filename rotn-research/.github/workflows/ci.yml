# rotn-research CI -- the research-plane test suite.
#
# The research repo depends on the product (``pip install rotn``).  The CI
# checks out the product in the root directory and the research repo in the
# ``rotn-research/`` subdirectory (the layout the ``conftest.py`` expects:
# product = parent of research).  No Java, no network: the product has zero
# runtime deps, and every engine that needs an external tool (TLC, Apalache,
# Z3) degrades to a skip or an "unknown" verdict, so the suite is green in a
# bare Python env.
name: rotn-research

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  research:
    name: research suite (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.10", "3.12"]
    steps:
      - name: Checkout product (dependency, root)
        uses: actions/checkout@v4
        with:
          repository: caravel/rotn
          path: .

      - name: Checkout research (subdirectory)
        uses: actions/checkout@v4
        with:
          repository: caravel/rotn-research
          path: rotn-research

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the product (zero runtime deps)
        run: python -m pip install .

      - name: Test suite (research, no Java, no network)
        working-directory: rotn-research
        run: python -m pytest tests -v

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rotn-research-py${{ matrix.python }}
          path: rotn-research/.pytest_cache/
          if-no-files-found: ignore