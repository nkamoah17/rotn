# Publish ROTN to PyPI (sdist + wheel) from a version tag.
#
# Triggered by pushing a tag matching `v*` (e.g. `v0.2.0`).  It uses a PyPI
# *trusted publisher* (OIDC) -- no API token is stored as a secret.
#
# Before the first publish, register the trusted publisher on PyPI:
#
#   https://pypi.org/project/rotn/#trusted-publishers
#
#     Username:    github
#     Repository:  nkamoah17/rotn
#     Environment: main
#
# (Prefer a token instead? Set the repo secret `PYPI_API_TOKEN` and change
# `trusted-publishing` to `false` in the publish step below.)
name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write   # required for trusted publishing (OIDC)

jobs:
  build-and-publish:
    name: sdist + wheel -> PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypi-publish/pypi-publish@v2
        with:
          packages-dir: dist
          # Trusted publishing (OIDC) -- no secret needed.  To use a token
          # instead, set `trusted-publishing: false` and add:
          #   user: __token__
          #   password: ${{ secrets.PYPI_API_TOKEN }}
          trusted-publishing: true