# ROTN -- Ship plane: publish the replay site to GitHub Pages (Phase I).
#
# The site (``site/``) is a pure static bundle -- a pure function of the RTF
# trace.  This workflow regenerates the site's RTF trace data from the
# committed sample policies with the *current* engine (``rot site``), then
# uploads the ``site/`` bundle as the Pages artifact and deploys it.
#
# The deployed URL is a *project site*: ``<owner>.github.io/<repo>/`` -- e.g.
# ``https://caravel.github.io/rot-verify/`` for the ``caravel/rot-verify``
# repo (the product identity referenced throughout the docs).  The workflow is
# repo-agnostic: it deploys whatever ``site/`` bundle is in the checked-out
# repo, and GitHub sets the live URL (exposed as the job's ``page_url``).
#
# No Java, no Z3, no network, and no package install: the engine is pure
# stdlib (zero runtime dependencies), so we run the site generator straight
# from the checked-out source tree (``python -m rot site``).  This sidesteps
# PEP 517 build isolation (which would otherwise have to fetch setuptools in
# an isolated env) and keeps the build dependency-free.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The Pages deploy needs to mint an OIDC token (id-token: write) and write to
# the Pages artifact (pages: write); checkout needs to read the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deploys to the single ``github-pages`` environment.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: build + deploy replay site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages (OIDC context for the deploy)
        uses: actions/configure-pages@v6

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Regenerate the replay site data (RTF traces + registry)
        # A pure function of the committed sample policies + the current
        # engine: re-derives the 10 canonical traces (spend-cap K-sweep + MCP
        # pair) into site/data and mirrors them into the deterministic
        # traces.js registry.  Runs from the source tree (no install needed --
        # the package is pure stdlib), so there is nothing to fetch.
        run: python -m rot site --out site/data

      - name: Sanity-check the bundle (10 traces + registry present)
        run: |
          set -e
          test -f site/index.html
          test -f site/data/traces.js
          count=$(ls site/data/*.trace.json | wc -l)
          echo "trace files: $count"
          test "$count" -eq 10

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
