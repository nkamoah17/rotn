# ROTN CI -- the pure-stdlib job.
#
# No Java, no Z3, no network: the package has zero runtime dependencies, and
# every engine that needs an external tool (TLC, Apalache, Z3) degrades to a
# skip or an "unknown" verdict, so the suite is green in a bare Python env.
#
# Phase D (tier gating): the ``workflow_dispatch`` inputs let a maintainer
# pin the audit tier + depth for a manual run.  The ``stdlib`` job always
# demonstrates the tier gate with the ``policy-six.json`` / ``tools-six.json``
# samples: the free tier (max_tools=5) is out of scope for a 6-tool catalog
# (exit 2), while the paid tier (max_tools=100) proves it (exit 0).
name: rotn

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: "Audit tier (free | paid)"
        required: false
        default: "free"
        type: choice
        options:
          - free
          - paid
      depth:
        description: "max_states override (capped to the tier max when tier=free)"
        required: false
        default: "1000"

jobs:
  stdlib:
    name: pure-stdlib (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The package floor is Python 3.6 (verified locally); 3.6 is EOL and
        # not preinstalled on runners, so the CI legs cover 3.8 -> 3.12.
        python: ["3.8", "3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the package (zero runtime deps)
        run: python -m pip install .

      - name: Test suite (no Java, no Z3)
        run: python -m unittest discover -s tests -v

      - name: 60-second CLI smoke (expected exit codes)
        run: |
          set -e
          rot --version
          code=0; rot check --policy samples/spendcap-buggy.dw --out out || code=$?
          [ "$code" -eq 1 ]
          test -f out/attack.jsonl
          code=0; rot replay out/attack.jsonl --policy samples/spendcap-buggy.dw || code=$?
          [ "$code" -eq 1 ]
          code=0; rot check --policy samples/spendcap-correct.dw --out out-correct || code=$?
          [ "$code" -eq 0 ]

      - name: CI gate -- JUnit XML + SARIF
        run: |
          set -e
          code=0; rot ci --policy samples/spendcap-buggy.dw --out ci || code=$?
          [ "$code" -eq 1 ]
          test -f ci/JUnit.xml
          test -f ci/results.sarif

      - name: Tier-gating demo (Phase D)
        # The 6-tool catalog exceeds the free tier cap (max_tools=5) ->
        # OUT_OF_SCOPE (exit 2).  The paid tier (max_tools=100) proves it
        # -> PASS (exit 0).  This is the D3 "Done when" #5 demonstration.
        run: |
          set -e
          echo "=== free tier (expect OUT_OF_SCOPE, exit 2) ==="
          code=0; rot check --mcp \
            --policy samples/policy-six.json \
            --tools samples/tools-six.json \
            --tier free --out out-tier-free || code=$?
          [ "$code" -eq 2 ]
          test -f out-tier-free/mcp_findings.json

          echo "=== paid tier (expect PASS, exit 0) ==="
          code=0; rot check --mcp \
            --policy samples/policy-six.json \
            --tools samples/tools-six.json \
            --tier paid --out out-tier-paid || code=$?
          [ "$code" -eq 0 ]
          test -f out-tier-paid/mcp_findings.json

      - name: Tier-gating demo (workflow_dispatch inputs)
        # When triggered manually, honour the chosen tier + depth.
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -e
          echo "tier=${{ inputs.tier }} depth=${{ inputs.depth }}"
          code=0; rot check --mcp \
            --policy samples/policy-six.json \
            --tools samples/tools-six.json \
            --tier "${{ inputs.tier }}" \
            --depth "${{ inputs.depth }}" \
            --out out-tier-custom || code=$?
          echo "custom exit code: $code"

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rotn-ci-py${{ matrix.python }}
          path: |
            ci/JUnit.xml
            ci/results.sarif
            out/attack.jsonl
            out-tier-free/mcp_findings.json
            out-tier-paid/mcp_findings.json
          if-no-files-found: ignore
