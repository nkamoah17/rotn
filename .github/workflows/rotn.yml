# ROTN CI -- the pure-stdlib job.
#
# No Java, no Z3, no network: the package has zero runtime dependencies, and
# every engine that needs an external tool (TLC, Apalache, Z3) degrades to a
# skip or an "unknown" verdict, so the suite is green in a bare Python env.
#
# The audit is full-strength for everyone (no free/paid budget split): a 6-tool
# catalog is in scope and proven.  The ``workflow_dispatch`` ``depth`` input
# lets a maintainer pin a max_states bound for a manual run.
name: rotn

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      depth:
        description: "optional max_states bound (may only lower the budget)"
        required: false
        default: "1000"

jobs:
  stdlib:
    name: pure-stdlib (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The package floor is Python 3.8 (see setup.py); the CI legs cover
        # 3.10 -> 3.13 (3.8/3.9 stay supported but aren't preinstalled on the
        # current runner images).
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the package (zero runtime deps)
        run: python -m pip install .

      - name: Test suite (no Java, no Z3)
        run: python -m unittest discover -s tests -v

      - name: Site smoke (rule -> attack -> proof -> coach + attestation)
        # The site (site/) is a zero-dependency plain-JS bundle; its smoke
        # tests run under Node with a browser stub (no browser needed) and
        # pin the E-section acceptance: the four-beat arc, the K-sweep +
        # to_proceed tags,
        # the attestation body, and the hash-pinned share URL (E1-E4).
        run: |
          node site/smoke_app.js
          node site/smoke_h.js

      - name: 60-second CLI smoke (expected exit codes)
        run: |
          set -e
          rot --version
          code=0; rot check --policy samples/spendcap-buggy.dw --out out || code=$?
          [ "$code" -eq 1 ]
          test -f out/attack.jsonl
          code=0; rot replay out/attack.jsonl --policy samples/spendcap-buggy.dw || code=$?
          [ "$code" -eq 1 ]
          code=0; rot check --policy samples/spendcap-correct.dw --out out-correct || code=$?
          [ "$code" -eq 0 ]

      - name: CI gate -- JUnit XML + SARIF
        run: |
          set -e
          code=0; rot ci --policy samples/spendcap-buggy.dw --out ci || code=$?
          [ "$code" -eq 1 ]
          test -f ci/JUnit.xml
          test -f ci/results.sarif

      - name: Full-strength MCP demo (Phase B)
        # Everyone is full-strength (max_tools=100), so the 6-tool catalog is
        # in scope and PROVEN (exit 0).  A user-set --depth bound, when given,
        # is the only thing that can cap the budget (and it can only lower it).
        run: |
          set -e
          echo "=== full-strength (expect PASS, exit 0) ==="
          code=0; rot check --mcp \
            --policy samples/policy-six.json \
            --tools samples/tools-six.json \
            --out out-mcp || code=$?
          [ "$code" -eq 0 ]
          test -f out-mcp/mcp_findings.json

      - name: Depth demo (workflow_dispatch inputs)
        # When triggered manually, honour the chosen max_states bound.
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -e
          echo "depth=${{ inputs.depth }}"
          code=0; rot check --mcp \
            --policy samples/policy-six.json \
            --tools samples/tools-six.json \
            --depth "${{ inputs.depth }}" \
            --out out-depth-custom || code=$?
          echo "custom exit code: $code"

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rotn-ci-py${{ matrix.python }}
          path: |
            ci/JUnit.xml
            ci/results.sarif
            out/attack.jsonl
            out-mcp/mcp_findings.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # The bidirectional reference gate (docs/reference-gate.md, WS4).
  #
  # A SEPARATE job on purpose: the `stdlib` job above stays binary-free (no
  # Java, no Z3, no Rust, no network) so it is green in a bare Python env.
  # This job is the merge-blocking leg: it builds the EXACT pinned Dogwood
  # commit (spec §9), points DOGWOOD_BIN at it, and runs the v2 gate.
  # A non-zero gate exit (DISAGREE / VACUOUS / UNKNOWN-over-threshold /
  # error) FAILS the merge.
  # ---------------------------------------------------------------------------
  reference-gate:
    name: reference gate (bidirectional, dogwood @ 4ec5e2c)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package (zero runtime deps)
        run: python -m pip install .

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build the Dogwood reference interpreter @ pinned commit
        # `dogwood-cli` is the `dogwood` binary (see the dogwood workspace);
        # `cargo build -p dogwood-cli` builds just the binary + its deps.
        run: |
          set -e
          git init dogwood-ref
          cd dogwood-ref
          git remote add origin https://github.com/dogwood-policy/dogwood.git
          git fetch --depth 1 origin 4ec5e2c01b44ff3882a231ae5d315b330b38fa25
          git checkout FETCH_HEAD
          cargo build -p dogwood-cli
          cd ..
          echo "DOGWOOD_BIN=$(pwd)/dogwood-ref/target/debug/dogwood" >> "$GITHUB_ENV"

      - name: Run the bidirectional reference gate (merge-blocking)
        # Exit 0 = all AGREE or waived; 1 = any DISAGREE / VACUOUS;
        # 2 = UNKNOWN over threshold; 3 = error (spec §4/§5).  Non-zero
        # blocks the merge.
        run: |
          set -e
          code=0; rot replay --oracle dogwood --gate --bidirectional \
            --profile dogwood-ref@4ec5e2c \
            --out out/gate || code=$?
          echo "reference-gate exit code: $code"
          [ "$code" -eq 0 ]

      - name: Upload the gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotn-reference-gate
          path: out/gate
          if-no-files-found: warn
